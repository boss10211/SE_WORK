<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор заработка STUFF EXPRESS </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background: url('https://img.photohub.my/i/09/090715b4a562f06626471b638ef27c08.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        h1 {
            margin: 20px 0;
            text-align: center;
            color: #FFAA00;
        }
        .banner {
            margin: 20px 0;
            width: 100%;
            max-width: 600px;
            height: auto;
            text-align: center;
        }
        .slider-container {
            text-align: center;
            margin: 30px 0;
            border-radius: 15px;
            background-color: rgba(255, 140, 0, 0.85);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            max-width: 400px;
            margin: 15px 0;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            background: #ccc;
            border-radius: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            background: url('https://img.photohub.my/i/28/28fa3efea78974824b0a81e96e8d3f66.jpg') no-repeat center;
            background-size: contain;
            width: 40px;
            height: 40px;
            margin-top: -16px;
            border: none;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #fff;
        }
        .italic-text {
            margin-top: 15px;
            text-align: center;
            font-style: italic;
            color: #fff;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #FF8C00;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .button:hover {
            background-color: #696969;
        }

        /* Медиа-запрос для адаптации под мобильные устройства */
        @media (max-width: 768px) {
            body {
                padding: 20px;
                background-size: cover;
            }

            h1 {
                font-size: 20px;
            }

            .banner {
                width: 90%;
            }

            .slider-container {
                width: 100%;
                padding: 15px;
            }

            input[type="range"] {
                max-width: 100%;
            }

            .button-container {
                flex-direction: column;
                gap: 10px;
            }

            .button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <img class="banner" src="https://img.photohub.my/i/67/674e06004544f8abd00444c082018ecc.jpg" alt="Баннер">
    <h1>🔴ЗАРОБОТОК С STUFF EXPRESS🟠</h1>
    <div class="slider-container">
        <label>Ежедневный показатель выполненных кладов🔴 (20–100):</label>
        <input type="range" id="boxes" min="20" max="100" value="60" oninput="updateCalculation()">
        <div>Клады: <span id="boxesValue">60</span></div>
        <label>Рабочие дни за месяц🔴 (7–31):</label>
        <input type="range" id="days" min="7" max="31" value="19" oninput="updateCalculation()">
        <div>Дни: <span id="daysValue">19</span></div>
    </div>
    <div class="result">
        <p>Заработок за неделю: <span id="weeklyEarnings">0</span> руб.</p>
        <p>Заработок за месяц: <span id="monthlyEarnings">0</span> руб.</p>
    </div>
    <p class="italic-text">(Расчет заработной платы, при условии выполнения +130 кладов в неделю)</p>
    <div class="button-container">
        <a href="https://zz.news/" class="button">WORK MANNAGER</a>
        <a href="https://zz.news/" class="button">OPERATOR</a>
    </div>

    <script>
        function updateCalculation() {
            const boxesPerDay = parseInt(document.getElementById('boxes').value);
            const workingDays = parseInt(document.getElementById('days').value);
            document.getElementById('boxesValue').textContent = boxesPerDay;
            document.getElementById('daysValue').textContent = workingDays;

            const boxesPerWeek = boxesPerDay * 7;
            const boxesPerMonth = boxesPerDay * workingDays;

            const ratePerBox = 600; // Фиксированная стоимость одной коробки
            const weeklyEarnings = boxesPerWeek * ratePerBox;
            const monthlyEarnings = boxesPerMonth * ratePerBox;

            document.getElementById('weeklyEarnings').textContent = weeklyEarnings;
            document.getElementById('monthlyEarnings').textContent = monthlyEarnings;
        }

        updateCalculation();
    </script>
</body>

</html>
